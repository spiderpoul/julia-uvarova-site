name: Rebuild maternity cover

on:
  push:
    paths:
      - ".tmp-maternity-cover/READY"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild cover image
        shell: bash
        run: |
          mkdir -p assets
          cat .tmp-maternity-cover/part-* | tr -d '\n\r' | base64 -d > assets/ot-straha-k-lyubvi-horizontal.webp
          echo "25d7690906f1202aadb83c6e34f6a203500b3a50cbc304bf068242a457e77499  assets/ot-straha-k-lyubvi-horizontal.webp" | sha256sum -c -
          rm -rf .tmp-maternity-cover
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add maternity book cover"
          git push
